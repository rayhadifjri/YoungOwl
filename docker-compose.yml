# Young Owl — Phase 1 stack.
# Networks follow docs/architecture.md §4. lab_net (vulnerable targets + Kali worker) arrives in Phase 3.
name: young-owl

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [core_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    # Dev only: uncomment to reach Postgres from your machine. Never on the VPS.
    # ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks: [core_net]

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/migrate.Dockerfile }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED: ${SEED_ON_START:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_RESEARCHER_PASSWORD: ${SEED_RESEARCHER_PASSWORD}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD}
    depends_on: { postgres: { condition: service_healthy } }
    networks: [core_net]
    restart: "no"

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_PORT: 4000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [core_net, edge_net]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args: { API_INTERNAL_URL: http://api:4000 }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    networks: [edge_net]
    # Bound to localhost: put Nginx/Traefik with HTTPS in front on the VPS (Phase 5),
    # or use an SSH tunnel (ssh -L 3000:localhost:3000 you@vps) until then.
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

networks:
  core_net: { internal: true }
  edge_net: {}

volumes:
  pgdata:
